services:
  - type: web
    name: teen-mental-analyser
    runtime: python
    buildCommand: "export PYTHON_VERSION=3.11.8 && pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python -m uvicorn api_server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

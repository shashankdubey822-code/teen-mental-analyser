services:
  - type: web
    name: teen-mental-analyser
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "export PATH=\"/opt/render/project/src/python/bin:$PATH\" && python -m uvicorn api_server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
